name: CI

on:
  push:
    paths-ignore:
      - 'apps/mobile/**'
      - 'mobile/**'
      - 'MOBILE_IOS_LAUNCH_COMMANDS.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            packages/types/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
      - run: npm ci && npm run build
        working-directory: packages/types
      - run: npm ci
      - run: npm run build
      - run: npm run observability:validate
      - run: npm run observability:kpis
      - run: npm run observability:test
      - run: npm run test
      - name: Validate recovery and monitoring infrastructure safety boundaries
        run: node --test ../infra/recovery/stack.test.mjs ../infra/recovery/drill.test.mjs ../infra/monitoring/stack.test.mjs
      - name: Validate production isolation templates
        run: node --test ../infra/production/*.test.mjs
      - name: Validate workflow deployment boundaries
        run: node --test ../scripts/workflow-gates.test.mjs ../scripts/workflow-structure.test.mjs ../scripts/supabase-ci-bootstrap.test.mjs

  database-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PHASE1_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            packages/types/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - run: npm ci && npm run build
        working-directory: packages/types
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - name: Install all migrations into a disposable Supabase instance
        run: |
          set -euo pipefail
          drill_root=$(mktemp -d)
          echo "DARCI_SQL_DRILL_ROOT=$drill_root" >> "$GITHUB_ENV"
          supabase init --workdir "$drill_root"
          mkdir -p "$drill_root/supabase/migrations"
          cp supabase/migrations/*.sql "$drill_root/supabase/migrations/"
          node scripts/supabase-ci-bootstrap.mjs "$drill_root"
      - name: Verify fresh bootstrap contains reference data, not beta accounts or provider mappings
        run: PHASE2_TEST_DATABASE_URL="$PHASE1_TEST_DATABASE_URL" node backend/scripts/check-fresh-production-schema.mjs --confirm-isolated
      - name: Exercise actual SQL, role and Storage boundaries
        run: |
          set -euo pipefail
          node backend/scripts/test-phase1-finalization-sql.mjs --confirm-isolated
          node backend/scripts/test-phase1-identity-provenance-sql.mjs --confirm-isolated
          node backend/scripts/test-phase1-auth-session-sql.mjs --confirm-isolated
          node backend/scripts/test-phase1-auth-session-api.mjs "$DARCI_SQL_DRILL_ROOT/status.json" --confirm-isolated
          node backend/scripts/test-phase1-billing-sql.mjs --confirm-isolated
          node backend/scripts/test-legacy-reverification-sql.mjs --confirm-isolated
          node backend/scripts/test-phase1-storage-boundary.mjs "$DARCI_SQL_DRILL_ROOT/status.json" --confirm-isolated
      - name: Preserve sanitized bootstrap diagnostics
        if: failure() && env.DARCI_SQL_DRILL_ROOT != ''
        uses: actions/upload-artifact@v4
        with:
          name: database-bootstrap
          path: ${{ env.DARCI_SQL_DRILL_ROOT }}/bootstrap.sanitized.log
          retention-days: 7
          if-no-files-found: warn
      - name: Stop disposable database
        if: always() && env.DARCI_SQL_DRILL_ROOT != ''
        run: supabase stop --workdir "$DARCI_SQL_DRILL_ROOT" --no-backup

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run observability:test
      - run: npm test
      - run: npm run lint
      - name: Cache Next.js compiler output
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-node24-${{ hashFiles('apps/web/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-node24-${{ hashFiles('apps/web/package-lock.json') }}-
      - run: npm run build
      - run: npx tsc --noEmit

  types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/types/package-lock.json
      - run: npm ci
      - run: npm run build
