name: Deploy Production Candidate

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require passing server CI for this exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/workflow-gates.mjs wait-ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::427057633951:role/darci-production-github-release
          aws-region: us-east-1
      - uses: docker/setup-buildx-action@v3
      - name: Build production-only images without runtime secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://jdrgluisxhgegdsesman.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PRODUCTION_SUPABASE_ANON_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          node infra/production/build-images.mjs "phase2-${GITHUB_SHA::7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" /tmp/production-images.json --public-config
      - uses: actions/upload-artifact@v4
        with:
          name: production-image-manifest
          path: /tmp/production-images.json
      - name: Install the same pinned image scanner as staging
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.74.0
          cache: false
          path: ${{ runner.temp }}/scanner
      - name: Scan each exact production digest with the staging security policy
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/production-scans"
          for service in api worker web; do
            image_ref=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/production-images.json")).images[process.argv[1]]' "$service")
            node scripts/scan-runtime-image.mjs "$image_ref" "$RUNNER_TEMP/production-scans/$service.json" "$RUNNER_TEMP/production-scans/$service.tar"
            rm "$RUNNER_TEMP/production-scans/$service.tar"
          done
      - name: Preserve production scanner evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-image-scans
          path: ${{ runner.temp }}/production-scans/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Scan and promote images; preserve network and payment gates
        run: node infra/production/promote-images.mjs /tmp/production-images.json "$RUNNER_TEMP/production-scans"
      - name: Preserve release verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-receipt
          path: /tmp/production-release-receipt.json
          if-no-files-found: warn
          retention-days: 30
