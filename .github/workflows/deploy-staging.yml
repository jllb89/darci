name: Deploy Staging

on:
  push:
    branches:
      - master
    paths-ignore:
      - "apps/mobile/**"
      - "mobile/**"
      - "MOBILE_IOS_LAUNCH_COMMANDS.md"
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  ECS_CLUSTER: darci-staging
  API_SERVICE: darci-staging-api
  WORKER_SERVICE: darci-staging-worker
  WEB_SERVICE: darci-staging-web
  STAGING_NEXT_PUBLIC_API_BASE_URL: ${{ vars.STAGING_NEXT_PUBLIC_API_BASE_URL }}
  STAGING_WEB_APP_URL: https://app.staging.darciregistry.dev
  STAGING_AUTH_OTP_FROM_ADDRESS: DARCi <no-reply@darciregistry.com>
  STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}

jobs:
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      build_api: ${{ steps.matrix.outputs.build_api }}
      build_worker: ${{ steps.matrix.outputs.build_worker }}
      build_web: ${{ steps.matrix.outputs.build_web }}
      any_build: ${{ steps.matrix.outputs.any_build }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'packages/**'
              - 'api/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
            infra:
              - '.github/workflows/deploy-staging.yml'
              - '.dockerignore'

      - name: Build matrix
        id: matrix
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const isManualRun = process.env.GITHUB_EVENT_NAME === "workflow_dispatch";
          const backendChanged = isManualRun || process.env.BACKEND_CHANGED === "true" || process.env.INFRA_CHANGED === "true";
          const webChanged = isManualRun || process.env.WEB_CHANGED === "true" || process.env.INFRA_CHANGED === "true";

          const include = [];
          if (backendChanged) {
            include.push(
              { service: "API", repository: "darci-api", dockerfile: "backend/Dockerfile" },
              { service: "worker", repository: "darci-worker", dockerfile: "backend/Dockerfile.worker" },
            );
          }

          if (webChanged) {
            include.push({ service: "web", repository: "darci-web", dockerfile: "apps/web/Dockerfile" });
          }

          const buildApi = include.some((entry) => entry.repository === "darci-api");
          const buildWorker = include.some((entry) => entry.repository === "darci-worker");
          const buildWeb = include.some((entry) => entry.repository === "darci-web");
          const anyBuild = include.length > 0;

          console.log(`build_api=${buildApi}`);
          console.log(`build_worker=${buildWorker}`);
          console.log(`build_web=${buildWeb}`);
          console.log(`any_build=${anyBuild}`);
          console.log(`matrix=${JSON.stringify({ include })}`);
          NODE
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          WEB_CHANGED: ${{ steps.filter.outputs.web }}
          INFRA_CHANGED: ${{ steps.filter.outputs.infra }}

  build-images:
    needs: changes
    if: needs.changes.outputs.any_build == 'true'
    name: Build and Push ${{ matrix.service }} Image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}

    steps:
      - name: Check required configuration
        run: |
          missing=0
          for name in AWS_ACCOUNT_ID AWS_REGION AWS_DEPLOY_ROLE_ARN STAGING_NEXT_PUBLIC_API_BASE_URL STAGING_HEALTH_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name repository variable is required"
              missing=1
            fi
          done
          exit "$missing"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image tags
        run: |
          echo "ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=staging-${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load web public config
        if: matrix.repository == 'darci-web'
        run: |
          secret_json="$(aws secretsmanager get-secret-value --secret-id /darci/staging/app --query SecretString --output text)"
          node - "$secret_json" >> "$GITHUB_ENV" <<'NODE'
          const secret = JSON.parse(process.argv[2] ?? "{}");
          const supabaseUrl = secret.NEXT_PUBLIC_SUPABASE_URL || secret.SUPABASE_URL || "";
          const supabaseAnonKey = secret.NEXT_PUBLIC_SUPABASE_ANON_KEY || secret.SUPABASE_ANON_KEY || "";
          const sentryDsn = secret.NEXT_PUBLIC_SENTRY_DSN || secret.SENTRY_DSN || "";
          const sentryTracesSampleRate = secret.NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE || secret.SENTRY_TRACES_SAMPLE_RATE || "0.05";
          const mapsApiKey = secret.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || "";
          const mapsLibraries = secret.NEXT_PUBLIC_GOOGLE_MAPS_LIBRARIES || "places";
          const mapsAutocompleteEnabled = secret.NEXT_PUBLIC_GOOGLE_MAPS_AUTOCOMPLETE_ENABLED || "true";
          const mapsServerApiKey = secret.GOOGLE_MAPS_SERVER_API_KEY || "";
          const mapsServerGeocodeEnabled = secret.GOOGLE_MAPS_GEOCODE_USE_SERVER || "true";

          if (!supabaseUrl || !supabaseAnonKey || !sentryDsn || !mapsApiKey || !mapsServerApiKey) {
            console.error("/darci/staging/app must contain NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, SENTRY_DSN, NEXT_PUBLIC_GOOGLE_MAPS_API_KEY, and GOOGLE_MAPS_SERVER_API_KEY.");
            process.exit(1);
          }

          console.log(`STAGING_NEXT_PUBLIC_SUPABASE_URL=${supabaseUrl}`);
          console.log(`STAGING_NEXT_PUBLIC_SUPABASE_ANON_KEY=${supabaseAnonKey}`);
          console.log(`STAGING_NEXT_PUBLIC_SENTRY_DSN=${sentryDsn}`);
          console.log("STAGING_NEXT_PUBLIC_SENTRY_ENVIRONMENT=staging");
          console.log(`STAGING_NEXT_PUBLIC_SENTRY_RELEASE=${process.env.GITHUB_SHA || ""}`);
          console.log(`STAGING_NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=${sentryTracesSampleRate}`);
          console.log(`STAGING_NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${mapsApiKey}`);
          console.log(`STAGING_NEXT_PUBLIC_GOOGLE_MAPS_LIBRARIES=${mapsLibraries}`);
          console.log(`STAGING_NEXT_PUBLIC_GOOGLE_MAPS_AUTOCOMPLETE_ENABLED=${mapsAutocompleteEnabled}`);
          console.log(`STAGING_GOOGLE_MAPS_GEOCODE_USE_SERVER=${mapsServerGeocodeEnabled}`);
          NODE

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        run: |
          build_args=()
          if [ "${{ matrix.repository }}" = "darci-web" ]; then
            build_args+=(--build-arg "NEXT_PUBLIC_API_BASE_URL=$STAGING_NEXT_PUBLIC_API_BASE_URL")
            build_args+=(--build-arg "NEXT_PUBLIC_SUPABASE_URL=$STAGING_NEXT_PUBLIC_SUPABASE_URL")
            build_args+=(--build-arg "NEXT_PUBLIC_SUPABASE_ANON_KEY=$STAGING_NEXT_PUBLIC_SUPABASE_ANON_KEY")
            build_args+=(--build-arg "NEXT_PUBLIC_SENTRY_DSN=$STAGING_NEXT_PUBLIC_SENTRY_DSN")
            build_args+=(--build-arg "NEXT_PUBLIC_SENTRY_ENVIRONMENT=$STAGING_NEXT_PUBLIC_SENTRY_ENVIRONMENT")
            build_args+=(--build-arg "NEXT_PUBLIC_SENTRY_RELEASE=$STAGING_NEXT_PUBLIC_SENTRY_RELEASE")
            build_args+=(--build-arg "NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=$STAGING_NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE")
            build_args+=(--build-arg "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=$STAGING_NEXT_PUBLIC_GOOGLE_MAPS_API_KEY")
            build_args+=(--build-arg "NEXT_PUBLIC_GOOGLE_MAPS_LIBRARIES=$STAGING_NEXT_PUBLIC_GOOGLE_MAPS_LIBRARIES")
            build_args+=(--build-arg "NEXT_PUBLIC_GOOGLE_MAPS_AUTOCOMPLETE_ENABLED=$STAGING_NEXT_PUBLIC_GOOGLE_MAPS_AUTOCOMPLETE_ENABLED")
          fi

          buildx_command=(
            docker buildx build
            --progress=plain
            --platform linux/arm64
            -f "${{ matrix.dockerfile }}"
            --cache-from type=registry,ref="$ECR_REGISTRY/${{ matrix.repository }}:staging-buildcache"
            --cache-to type=registry,ref="$ECR_REGISTRY/${{ matrix.repository }}:staging-buildcache",mode=max,ignore-error=true
            "${build_args[@]}"
            -t "$ECR_REGISTRY/${{ matrix.repository }}:staging-latest"
            -t "$ECR_REGISTRY/${{ matrix.repository }}:$IMAGE_TAG"
            --push
            .
          )

          for attempt in 1 2 3; do
            if "${buildx_command[@]}"; then
              exit 0
            fi

            if [ "$attempt" = "3" ]; then
              echo "::error::Docker buildx push failed after 3 attempts"
              exit 1
            fi

            echo "Docker buildx push failed on attempt $attempt; retrying after a short backoff."
            sleep $((attempt * 20))
          done

  deploy:
    name: Deploy Staging
    needs:
      - changes
      - build-images
    if: needs.changes.outputs.any_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check required configuration
        run: |
          missing=0
          for name in AWS_ACCOUNT_ID AWS_REGION AWS_DEPLOY_ROLE_ARN STAGING_NEXT_PUBLIC_API_BASE_URL STAGING_HEALTH_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name repository variable is required"
              missing=1
            fi
          done
          exit "$missing"

      - name: Set image tags
        run: |
          echo "ECR_REGISTRY=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=staging-${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load web public config
        if: needs.changes.outputs.build_web == 'true'
        run: |
          secret_json="$(aws secretsmanager get-secret-value --secret-id /darci/staging/app --query SecretString --output text)"
          node - "$secret_json" >> "$GITHUB_ENV" <<'NODE'
          const secret = JSON.parse(process.argv[2] ?? "{}");
          const supabaseUrl = secret.NEXT_PUBLIC_SUPABASE_URL || secret.SUPABASE_URL || "";
          const supabaseAnonKey = secret.NEXT_PUBLIC_SUPABASE_ANON_KEY || secret.SUPABASE_ANON_KEY || "";
          const sentryDsn = secret.NEXT_PUBLIC_SENTRY_DSN || secret.SENTRY_DSN || "";
          const sentryTracesSampleRate = secret.NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE || secret.SENTRY_TRACES_SAMPLE_RATE || "0.05";
          const mapsApiKey = secret.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || "";
          const mapsLibraries = secret.NEXT_PUBLIC_GOOGLE_MAPS_LIBRARIES || "places";
          const mapsAutocompleteEnabled = secret.NEXT_PUBLIC_GOOGLE_MAPS_AUTOCOMPLETE_ENABLED || "true";
          const mapsServerApiKey = secret.GOOGLE_MAPS_SERVER_API_KEY || "";
          const mapsServerGeocodeEnabled = secret.GOOGLE_MAPS_GEOCODE_USE_SERVER || "true";

          if (!supabaseUrl || !supabaseAnonKey || !sentryDsn || !mapsApiKey || !mapsServerApiKey) {
            console.error("/darci/staging/app must contain NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, SENTRY_DSN, NEXT_PUBLIC_GOOGLE_MAPS_API_KEY, and GOOGLE_MAPS_SERVER_API_KEY.");
            process.exit(1);
          }

          console.log(`STAGING_NEXT_PUBLIC_SUPABASE_URL=${supabaseUrl}`);
          console.log(`STAGING_NEXT_PUBLIC_SUPABASE_ANON_KEY=${supabaseAnonKey}`);
          console.log(`STAGING_NEXT_PUBLIC_SENTRY_DSN=${sentryDsn}`);
          console.log("STAGING_NEXT_PUBLIC_SENTRY_ENVIRONMENT=staging");
          console.log(`STAGING_NEXT_PUBLIC_SENTRY_RELEASE=${process.env.GITHUB_SHA || ""}`);
          console.log(`STAGING_NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=${sentryTracesSampleRate}`);
          console.log(`STAGING_NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${mapsApiKey}`);
          console.log(`STAGING_NEXT_PUBLIC_GOOGLE_MAPS_LIBRARIES=${mapsLibraries}`);
          console.log(`STAGING_NEXT_PUBLIC_GOOGLE_MAPS_AUTOCOMPLETE_ENABLED=${mapsAutocompleteEnabled}`);
          console.log(`STAGING_GOOGLE_MAPS_GEOCODE_USE_SERVER=${mapsServerGeocodeEnabled}`);
          NODE

      - name: Register API task definition
        if: needs.changes.outputs.build_api == 'true'
        run: |
          current_task_definition="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$API_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"

          aws ecs describe-task-definition \
            --task-definition "$current_task_definition" \
            --query taskDefinition \
            --output json > /tmp/api-task-definition.json

          node <<'NODE' > /tmp/api-task-definition-next.json
          const fs = require("node:fs");
          const taskDefinition = JSON.parse(fs.readFileSync("/tmp/api-task-definition.json", "utf8"));
          const allowedKeys = [
            "family",
            "taskRoleArn",
            "executionRoleArn",
            "networkMode",
            "containerDefinitions",
            "volumes",
            "placementConstraints",
            "requiresCompatibilities",
            "cpu",
            "memory",
            "runtimePlatform",
          ];
          const nextDefinition = Object.fromEntries(
            allowedKeys
              .filter((key) => taskDefinition[key] !== undefined)
              .map((key) => [key, taskDefinition[key]]),
          );
          const authEnv = {
            API_BASE_URL: process.env.STAGING_NEXT_PUBLIC_API_BASE_URL,
            APP_BASE_URL: process.env.STAGING_WEB_APP_URL,
            WEB_APP_URL: process.env.STAGING_WEB_APP_URL,
            AUTH_ALLOWED_ORIGINS: process.env.STAGING_WEB_APP_URL,
            AUTH_OTP_FROM_ADDRESS: process.env.STAGING_AUTH_OTP_FROM_ADDRESS,
            RESEND_FAILURE_MODE: "strict",
            AUTH_EMAIL_SEND_COOLDOWN_SECONDS: "60",
            GOOGLE_MAPS_GEOCODE_USE_SERVER: process.env.STAGING_GOOGLE_MAPS_GEOCODE_USE_SERVER || "true",
            LEDGER_ANCHOR_MODE: "stub",
            LEDGER_ALLOW_STUB_PROVIDER: "true",
            NOTIFICATION_PUSH_PROVIDER: "apns",
          };

          for (const container of nextDefinition.containerDefinitions) {
            if (container.name !== "api") {
              continue;
            }

            container.image = `${process.env.ECR_REGISTRY}/darci-api:${process.env.IMAGE_TAG}`;
            const envByName = new Map((container.environment ?? []).map((entry) => [entry.name, entry]));
            for (const [name, value] of Object.entries(authEnv)) {
              envByName.set(name, { name, value });
            }
            container.environment = Array.from(envByName.values()).sort((left, right) => left.name.localeCompare(right.name));
            container.secrets = (container.secrets ?? []).filter((entry) => !Object.prototype.hasOwnProperty.call(authEnv, entry.name));

            if (!container.secrets.some((entry) => entry.name === "GOOGLE_MAPS_SERVER_API_KEY")) {
              const secretArn = `arn:aws:secretsmanager:${process.env.AWS_REGION}:${process.env.AWS_ACCOUNT_ID}:secret:/darci/staging/app`;
              container.secrets.push({
                name: "GOOGLE_MAPS_SERVER_API_KEY",
                valueFrom: `${secretArn}:GOOGLE_MAPS_SERVER_API_KEY::`,
              });
            }
          }

          process.stdout.write(`${JSON.stringify(nextDefinition, null, 2)}\n`);
          NODE

          next_task_definition="$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/api-task-definition-next.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "API_TASK_DEFINITION=$next_task_definition" >> "$GITHUB_ENV"

      - name: Register worker task definition
        if: needs.changes.outputs.build_worker == 'true'
        run: |
          current_task_definition="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$WORKER_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"

          aws ecs describe-task-definition \
            --task-definition "$current_task_definition" \
            --query taskDefinition \
            --output json > /tmp/worker-task-definition.json

          node <<'NODE' > /tmp/worker-task-definition-next.json
          const fs = require("node:fs");
          const taskDefinition = JSON.parse(fs.readFileSync("/tmp/worker-task-definition.json", "utf8"));
          const allowedKeys = [
            "family",
            "taskRoleArn",
            "executionRoleArn",
            "networkMode",
            "containerDefinitions",
            "volumes",
            "placementConstraints",
            "requiresCompatibilities",
            "cpu",
            "memory",
            "runtimePlatform",
          ];
          const nextDefinition = Object.fromEntries(
            allowedKeys
              .filter((key) => taskDefinition[key] !== undefined)
              .map((key) => [key, taskDefinition[key]]),
          );
          const workerEnv = {
            LEDGER_ANCHOR_MODE: "stub",
            LEDGER_ALLOW_STUB_PROVIDER: "true",
            NOTIFICATION_PUSH_PROVIDER: "apns",
          };

          for (const container of nextDefinition.containerDefinitions) {
            if (container.name === "worker") {
              container.image = `${process.env.ECR_REGISTRY}/darci-worker:${process.env.IMAGE_TAG}`;
              const envByName = new Map((container.environment ?? []).map((entry) => [entry.name, entry]));
              for (const [name, value] of Object.entries(workerEnv)) {
                envByName.set(name, { name, value });
              }
              container.environment = Array.from(envByName.values()).sort((left, right) => left.name.localeCompare(right.name));
              container.secrets = (container.secrets ?? []).filter((entry) => !Object.prototype.hasOwnProperty.call(workerEnv, entry.name));
            }
          }

          process.stdout.write(`${JSON.stringify(nextDefinition, null, 2)}\n`);
          NODE

          next_task_definition="$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/worker-task-definition-next.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "WORKER_TASK_DEFINITION=$next_task_definition" >> "$GITHUB_ENV"

      - name: Register web task definition
        if: needs.changes.outputs.build_web == 'true'
        run: |
          current_task_definition="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$WEB_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)"

          aws ecs describe-task-definition \
            --task-definition "$current_task_definition" \
            --query taskDefinition \
            --output json > /tmp/web-task-definition.json

          node <<'NODE' > /tmp/web-task-definition-next.json
          const fs = require("node:fs");
          const taskDefinition = JSON.parse(fs.readFileSync("/tmp/web-task-definition.json", "utf8"));
          const allowedKeys = [
            "family",
            "taskRoleArn",
            "executionRoleArn",
            "networkMode",
            "containerDefinitions",
            "volumes",
            "placementConstraints",
            "requiresCompatibilities",
            "cpu",
            "memory",
            "runtimePlatform",
          ];
          const nextDefinition = Object.fromEntries(
            allowedKeys
              .filter((key) => taskDefinition[key] !== undefined)
              .map((key) => [key, taskDefinition[key]]),
          );

          for (const container of nextDefinition.containerDefinitions) {
            if (container.name === "web") {
              container.image = `${process.env.ECR_REGISTRY}/darci-web:${process.env.IMAGE_TAG}`;
            }
          }

          process.stdout.write(`${JSON.stringify(nextDefinition, null, 2)}\n`);
          NODE

          next_task_definition="$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/web-task-definition-next.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"
          echo "WEB_TASK_DEFINITION=$next_task_definition" >> "$GITHUB_ENV"

      - name: Force ECS deployments
        run: |
          if [ "${{ needs.changes.outputs.build_api }}" = "true" ]; then
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$API_SERVICE" --task-definition "$API_TASK_DEFINITION" >/dev/null
          fi
          if [ "${{ needs.changes.outputs.build_worker }}" = "true" ]; then
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$WORKER_SERVICE" --task-definition "$WORKER_TASK_DEFINITION" >/dev/null
          fi
          if [ "${{ needs.changes.outputs.build_web }}" = "true" ]; then
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$WEB_SERVICE" --task-definition "$WEB_TASK_DEFINITION" >/dev/null
          fi

      - name: Wait for ECS stability
        run: |
          services=()
          if [ "${{ needs.changes.outputs.build_api }}" = "true" ]; then
            services+=("$API_SERVICE")
          fi
          if [ "${{ needs.changes.outputs.build_worker }}" = "true" ]; then
            services+=("$WORKER_SERVICE")
          fi
          if [ "${{ needs.changes.outputs.build_web }}" = "true" ]; then
            services+=("$WEB_SERVICE")
          fi

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "${services[@]}"

      - name: Smoke test API health
        run: |
          curl --fail --show-error --silent --max-time 20 "$STAGING_HEALTH_URL"
          echo

      - name: Smoke test auth OTP ingress
        run: |
          headers_file="$(mktemp)"
          body_file="$(mktemp)"
          status_code="$(curl --show-error --silent --max-time 20 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Origin: $STAGING_WEB_APP_URL" \
            --dump-header "$headers_file" \
            --output "$body_file" \
            --write-out "%{http_code}" \
            --data '{"email":"invalid","returnTo":"/app"}' \
            "$STAGING_NEXT_PUBLIC_API_BASE_URL/auth/otp/start")"

          if [ "$status_code" != "400" ]; then
            echo "::error::Expected auth OTP validation response to be 400, got $status_code"
            cat "$body_file"
            exit 1
          fi

          if ! grep -qi '^x-darci-auth-otp-logger: ingress-v1' "$headers_file"; then
            echo "::error::Auth OTP ingress marker header missing"
            cat "$headers_file"
            exit 1
          fi
