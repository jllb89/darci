name: iOS
on:
  push:
    paths:
      - 'apps/mobile/**'
      - 'api/**'
      - '.github/workflows/ios.yml'
      - 'scripts/summarize-ios-tests*'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'api/**'
      - '.github/workflows/ios.yml'
      - 'scripts/summarize-ios-tests*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DARCI_IOS_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
      DARCI_IOS_DEVICE_NAME: iPhone 17 Pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate workflow and result-summary helpers
        run: node --test scripts/workflow-structure.test.mjs scripts/summarize-ios-tests.test.mjs
      - name: Generate the Xcode project from its tracked specification
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version
          make -C apps/mobile generate
          test -f apps/mobile/DARCiMobile.xcodeproj/project.pbxproj
          cmp apps/mobile/Package.resolved apps/mobile/DARCiMobile.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Identify Xcode cache boundary
        id: xcode
        run: |
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          xcodebuild -version
          echo "version=$(xcodebuild -version | tr '\n ' '--')-XcodeGen-$(xcodegen --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Select and start the pinned iPhone simulator
        run: |
          set -euo pipefail
          # Exercise keyboard avoidance with the full onscreen keyboard.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          simulator_id="$(xcrun simctl list devices available -j | node -e '
            let input="";process.stdin.on("data",b=>input+=b);process.stdin.on("end",()=>{
              const devices=JSON.parse(input).devices[process.env.DARCI_IOS_RUNTIME] ?? [];
              const device=devices.find(d=>d.name===process.env.DARCI_IOS_DEVICE_NAME);
              if(!device)throw new Error("Missing "+process.env.DARCI_IOS_DEVICE_NAME+" on "+process.env.DARCI_IOS_RUNTIME);
              console.log(device.udid);
            });')"
          echo "DARCI_CI_SIMULATOR=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id"
      - name: Cache locked Swift packages
        id: packages
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/darci-ios-packages
          key: ios-spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/mobile/Package.resolved') }}
      - name: Cache incremental build products
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/darci-ios-build/Build
            ${{ runner.temp }}/darci-ios-build/ModuleCache.noindex
            ${{ runner.temp }}/darci-ios-build/SDKStatCaches.noindex
          key: ios-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ env.DARCI_IOS_RUNTIME }}-${{ hashFiles('apps/mobile/project.yml', 'apps/mobile/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ios-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ env.DARCI_IOS_RUNTIME }}-${{ hashFiles('apps/mobile/project.yml', 'apps/mobile/Package.resolved') }}-
      - name: Build the app and full test suites once
        id: build
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -project apps/mobile/DARCiMobile.xcodeproj -scheme DARCiMobile \
            -configuration Debug -destination "platform=iOS Simulator,id=$DARCI_CI_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/darci-ios-build" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/darci-ios-packages" \
            -onlyUsePackageVersionsFromResolvedFile -skipPackageUpdates -showBuildTimingSummary \
            -parallel-testing-enabled NO COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            DARCI_API_BASE_URL=http://127.0.0.1:1 DARCI_SUPABASE_URL=http://127.0.0.1:1 \
            DARCI_SUPABASE_ANON_KEY=test-anon-key DARCI_SENTRY_DSN=
      # Persist successful compilation even when a later UI assertion fails.
      # A cache hit never substitutes for building/testing the current revision.
      - name: Save resolved Swift packages
        if: steps.build.outcome == 'success' && steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/darci-ios-packages
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - name: Save successful build products
        if: steps.build.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/darci-ios-build/Build
            ${{ runner.temp }}/darci-ios-build/ModuleCache.noindex
            ${{ runner.temp }}/darci-ios-build/SDKStatCaches.noindex
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Run the full unit and UI test suites without rebuilding
        run: |
          set -euo pipefail
          test_run="$(node -e '
            const fs=require("node:fs"),path=require("node:path");
            const dir=path.join(process.env.RUNNER_TEMP,"darci-ios-build/Build/Products");
            const files=fs.readdirSync(dir).filter(f=>f.startsWith("DARCiMobile_")&&f.endsWith(".xctestrun"));
            if(files.length!==1)throw new Error("Expected exactly one DARCi test bundle, got "+files.length);
            console.log(path.join(dir,files[0]));')"
          xcodebuild test-without-building -xctestrun "$test_run" \
            -destination "platform=iOS Simulator,id=$DARCI_CI_SIMULATOR" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/darci-ios-test-results.xcresult"
      - name: Summarize test results
        if: always() && steps.build.outcome == 'success'
        run: |
          if test -d "$RUNNER_TEMP/darci-ios-test-results.xcresult"; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/darci-ios-test-results.xcresult" --compact \
              > "$RUNNER_TEMP/darci-ios-test-summary.json"
            node scripts/summarize-ios-tests.mjs "$RUNNER_TEMP/darci-ios-test-summary.json"
          fi
      - name: Preserve iOS test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: darci-ios-test-results
          path: |
            ${{ runner.temp }}/darci-ios-test-results.xcresult
            ${{ runner.temp }}/darci-ios-test-summary.json
          if-no-files-found: ignore
          retention-days: 7
