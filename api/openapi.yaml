components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Document:
      type: object
      properties:
        id:
          type: string
        idn:
          type: string
          nullable: true
        status:
          type: string
        documentType:
          type: string
        jurisdiction:
          type: string
        productFlowMode:
          type: string
          enum:
            - poa_only
            - trust_bundle
            - notarize_document
        selectedFamilies:
          type: array
          items:
            type: string
            enum:
              - poa
              - trust
              - idn
        outputBundle:
          type: array
          items:
            $ref: "#/components/schemas/DocumentOutputBundleItem"
        createdAt:
          type: string
          format: date-time
    DocumentOutputBundleItem:
      type: object
      properties:
        outputKey:
          type: string
        outputLabel:
          type: string
        isRequired:
          type: boolean
        sortOrder:
          type: integer
        metadata:
          type: object
          additionalProperties: true
    DocumentVersion:
      type: object
      properties:
        id:
          type: string
        version:
          type: integer
        storagePath:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        isFinal:
          type: boolean
        createdAt:
          type: string
          format: date-time
    SignatureField:
      type: object
      properties:
        id:
          type: string
        pageNumber:
          type: integer
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        required:
          type: boolean
    TimelineEvent:
      type: object
      properties:
        action:
          type: string
        timestamp:
          type: string
          format: date-time
        actorId:
          type: string
    NotaryContext:
      type: object
      properties:
        requestId:
          type: string
        documentId:
          type: string
        jurisdiction:
          type: string
        idRequirements:
          type: string
        acknowledgmentTemplate:
          type: string
        appearanceType:
          type: string
          description: Appearance model for notarization (e.g., ipen).
        venueRequired:
          type: boolean
        consentRequired:
          type: boolean
        meetingId:
          type: string
          nullable: true
        meetingStatus:
          type: string
        meetingScheduledAt:
          type: string
          format: date-time
          nullable: true
        meetingTimezone:
          type: string
          nullable: true
        meetingLocation:
          type: string
          nullable: true
    DocumentListResponse:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"
    DashboardResponse:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"
        activity:
          type: array
          items:
            $ref: "#/components/schemas/DashboardActivity"
        counts:
          $ref: "#/components/schemas/DashboardCounts"
    NotaryDashboardResponse:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/NotarizationRequest"
        meetings:
          type: array
          items:
            $ref: "#/components/schemas/Meeting"
        activity:
          type: array
          items:
            $ref: "#/components/schemas/DashboardActivity"
        counts:
          $ref: "#/components/schemas/NotaryDashboardCounts"
    DashboardActivity:
      type: object
      properties:
        action:
          type: string
        timestamp:
          type: string
          format: date-time
        documentId:
          type: string
          nullable: true
        entityType:
          type: string
        entityId:
          type: string
          nullable: true
    DashboardCounts:
      type: object
      properties:
        draft:
          type: integer
        pendingSignature:
          type: integer
        pendingNotary:
          type: integer
        completed:
          type: integer
        total:
          type: integer
    NotaryDashboardCounts:
      type: object
      properties:
        pending:
          type: integer
        scheduled:
          type: integer
        completed:
          type: integer
        total:
          type: integer
    DocumentDetailResponse:
      type: object
      properties:
        document:
          $ref: "#/components/schemas/Document"
    DocumentReviewOutput:
      type: object
      properties:
        outputKey:
          type: string
        outputLabel:
          type: string
        versionId:
          type: string
        generationRunId:
          type: string
          nullable: true
        version:
          type: integer
        fileName:
          type: string
          nullable: true
        mimeType:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          format: int64
          nullable: true
        createdAt:
          type: string
          format: date-time
        downloadUrl:
          type: string
        isFinal:
          type: boolean
    PendingDocumentReviewOutput:
      type: object
      properties:
        outputKey:
          type: string
        outputLabel:
          type: string
        status:
          type: string
          enum:
            - queued
            - blocked
            - rendering
            - rendered
            - failed
            - canceled
            - unsupported_format
            - not_started
        errorMessage:
          type: string
          nullable: true
        versionId:
          type: string
          nullable: true
        mimeType:
          type: string
          nullable: true
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/GenerationRunBlocker"
    DocumentReviewApproval:
      type: object
      properties:
        approvedAt:
          type: string
          format: date-time
          nullable: true
        reviewSource:
          type: string
          nullable: true
        latestVersionId:
          type: string
          nullable: true
        latestRenderedRunId:
          type: string
          nullable: true
        approvedOutputKeys:
          type: array
          items:
            type: string
        approvedVersionIds:
          type: array
          items:
            type: string
    DocumentReview:
      type: object
      properties:
        state:
          type: string
          enum:
            - approved
            - ready
            - generating
            - empty
        requiresGeneration:
          type: boolean
        missingOutputKeys:
          type: array
          items:
            type: string
        allVisibleOutputsReady:
          type: boolean
        canApprove:
          type: boolean
        reviewApproval:
          allOf:
            - nullable: true
            - $ref: "#/components/schemas/DocumentReviewApproval"
        outputs:
          type: array
          items:
