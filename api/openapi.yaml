        If the capture is the principal's completing signature, the response may include `remainingSignerInvites`. If the capture satisfies all required signer obligations, including optional signing groups, the response may include `signingCompletion` with persisted execution, invite-completion, notification, and document-status details. Invite dispatch or completion-notification failures are audited and do not roll back successful signature capture.
