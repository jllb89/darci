  /documents/{id}/submit-notarization:
    post:
      summary: Submit for notarization
      description: |
        Creates the compatibility notarization request plus the Phase 4 illuminotarization workflow row, returns the active code material, and enqueues the current notarization confirmation and next-step email templates in the internal notification outbox.

        Runtime records `system.code_delivered` with notification-outbox delivery metadata and now also writes workflow status history and code-delivery ledger rows. An optional selected notary can be pre-bound through the Phase 1 multi-role identity model. When `selectedNotaryUserId` is present, the backend requires an active notary role, a notary profile in the same normalized jurisdiction as the document, a non-expired commission, and a user different from the document owner.

        When selected-notary submission succeeds, the backend queues `notary_request_received_email` to the selected notary and best-effort processes that notification job inline for local/staging reliability. The email CTA text is `Review request` and currently points to `/app/notary`.

        Non-skipped submissions must start from `pending_notary`. `signatureSkipped = true` is accepted only for `product_flow_mode = notarize_document`; POA, trust, and other product flows must complete required signatures first.
      x-roles:
        - member
        - admin
        - service_role
      x-audit-events:
        - member.notarization_submit_started
        - member.document_signature_skipped
        - member.notarization_submitted
        - member.notary_selected
        - system.code_generated
        - system.code_delivered
        - system.selected_notary_notified
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                webhookUrl:
                  type: string
                  format: uri
                selectedNotaryUserId:
                  type: string
                  description: Optional internal user id for an active notary selected by the member. When present, the selected notary must have an active notary role, a notary profile in the same normalized jurisdiction as the document, a non-expired commission, and cannot be the document owner. When present, only that notary may successfully resolve the code.
                signatureSkipped:
                  type: boolean
                  description: Allows document notarization uploads to continue to notarization without applying a member signature only when `product_flow_mode` is `notarize_document`. Rejected for POA, Trust, and other products.
                signatureSkipReason:
                  type: string
                  maxLength: 200
                  description: Optional audit reason when signatureSkipped is true.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotarizationSubmitResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
