name: DARCiMobile

options:
  bundleIdPrefix: com.illuminote
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.54.1
  PhoneNumberKit:
    url: https://github.com/PhoneNumberKit/PhoneNumberKit.git
    from: 5.0.0
  Sentry:
    url: https://github.com/getsentry/sentry-apple-binaries.git
    exactVersion: 9.24.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 38K3YA2857
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "16"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

targets:
  DARCiMobile:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    entitlements:
      path: DARCiMobile/App/DARCiMobile.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.associated-domains:
          - applinks:app.staging.darciregistry.dev
          - applinks:app.darciregistry.dev
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: DARCiMobile/App/Info.plist
      properties:
        CFBundleDisplayName: DARCi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        DARCI_API_BASE_URL: $(DARCI_API_BASE_URL)
        DARCI_APNS_ENVIRONMENT: $(APS_ENVIRONMENT)
        DARCI_SUPABASE_URL: $(DARCI_SUPABASE_URL)
        DARCI_SUPABASE_ANON_KEY: $(DARCI_SUPABASE_ANON_KEY)
        DARCI_SENTRY_DSN: $(DARCI_SENTRY_DSN)
        DARCI_SENTRY_ENVIRONMENT: $(DARCI_SENTRY_ENVIRONMENT)
        NSLocationWhenInUseUsageDescription: DARCi uses your location to confirm that the member and Illuminotary are together for an in-person notarization session.
        UILaunchScreen: {}
        UIAppFonts:
          - FavoritMono-Regular.otf
          - MaisonNeue-Bold.ttf
          - MaisonNeue-BoldItalic.ttf
          - MaisonNeue-Book.ttf
          - MaisonNeue-BookItalic.ttf
          - MaisonNeue-Demi.ttf
          - MaisonNeue-DemiItalic.ttf
          - MaisonNeue-Light.ttf
          - MaisonNeue-LightItalic.ttf
          - MaisonNeue-Medium.ttf
          - MaisonNeue-MediumItalic.ttf
          - MaisonNeue-Mono.ttf
          - MaisonNeue-MonoItalic.ttf
    sources:
      - path: DARCiMobile
        excludes:
          - Resources
      - path: DARCiMobile/Resources
        buildPhase: resources
        excludes:
          - README.md
          - "**/.gitkeep"
    dependencies:
      - package: Supabase
      - package: PhoneNumberKit
      - package: Sentry
        product: Sentry-Static
    postBuildScripts:
      - name: Generate Sentry framework dSYM
        script: |
          if [ "${CONFIGURATION}" != "Release" ]; then
            exit 0
          fi

          sentry_binary="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/Sentry.framework/Sentry"
          sentry_dsym="${DWARF_DSYM_FOLDER_PATH}/Sentry.framework.dSYM"

          if [ -f "${sentry_binary}" ]; then
            /usr/bin/xcrun dsymutil "${sentry_binary}" -o "${sentry_dsym}"
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.illuminote.darci
        PRODUCT_NAME: DARCiMobile
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: DARCi App Store com.illuminote.darci TF 2026-08-10

  DARCiMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - DARCiMobileTests
    dependencies:
      - target: DARCiMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.illuminote.darci.tests
        GENERATE_INFOPLIST_FILE: YES

  DARCiMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - DARCiMobileUITests
    dependencies:
      - target: DARCiMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.illuminote.darci.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DARCiMobile:
    build:
      targets:
        DARCiMobile: all
        DARCiMobileTests: [test]
        DARCiMobileUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DARCiMobileTests
        - DARCiMobileUITests
    archive:
      config: Release
